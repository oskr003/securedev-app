services:
  jenkins:
    build:
      context: ./infra
      dockerfile: Dockerfile.jenkins
    container_name: securedev-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - securedev-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: securedev-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - securedev-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: securedev-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - securedev-net
    restart: unless-stopped

networks:
  securedev-net:
    name: securedev-net
    driver: bridge

volumes:
  jenkins_home:
  grafana_data:
